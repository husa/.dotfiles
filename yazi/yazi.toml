[mgr]
show_hidden = true
linemode = "custom_mtime"

[preview]
tab_size = 2

[opener]
edit = [
  { run = '${EDITOR:-vi} %s', desc = "Open in $EDITOR", block = true },
  { run = 'nvim %s', desc = "Open in nvim", block = true },
  { run = 'neovide %s', block = false, orphan = true, desc = "Open in Neovide" },
  { run = 'code %s', block = false, orphan = true, desc = "Open in VSCode" },
  { run = 'open %s',  desc = "Open", for = "macos" },
]
open = [
  { run = 'open %s',  desc = "Open", for = "macos" },
]

[open]
append_rules = [
  # Text
  # add "open" to the list
  { mime = "text/*", use = [ "edit", "open", "reveal" ] },
]
